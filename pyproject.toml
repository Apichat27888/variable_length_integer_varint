[project]
name = "variable-length-integer-varint"
version = "0.1.0"
description = "Encodes and decodes integers using protobuf-style variable-length encoding, returning byte objects and consuming from arbitrary byte streams."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
